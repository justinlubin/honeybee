[package]
name = "honeybee-js"
version = "0.7.0"
authors = ["Justin Lubin <justin@jlubin.net>"]
description = "Honeybee Engine JavaScript bindings"
edition = "2021"
readme = "README.md"
repository = "https://github.com/justinlubin/honeybee"
license = "BSD-3-Clause"

[dependencies]
getrandom = { version = "0.2", features = ["js"] }

honeybee = { path = "../engine" }
indexmap = "2.14.2"
pbn = "0.3.0"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.128"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
